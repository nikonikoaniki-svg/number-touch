<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ナンバータッチ</title>
<style>
  :root{
    --bg:#f7f7f7;
    --panel:#ffffff;
    --text:#111;
    --border:#222;
    --accent:#111;
    --muted:#666;
    --shadow:0 10px 30px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app{max-width:1100px;margin:0 auto;padding:16px}
  .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  h1{font-size:clamp(24px,5vw,40px);margin:0;font-weight:800;letter-spacing:.03em}
  .sub{font-size:14px;color:var(--muted);margin-top:2px}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button,select,input{font:inherit}
  button{cursor:pointer}
  .btn{
    border:2px solid var(--border);
    background:#fff;
    color:#111;
    padding:10px 16px;
    border-radius:12px;
    font-weight:700;
    box-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .btn.primary{background:#111;color:#fff}
  .btn:active{transform:translateY(1px);box-shadow:none}
  .status{
    background:var(--panel);
    border:2px solid var(--border);
    border-radius:16px;
    padding:10px 14px;
    display:grid;
    grid-template-columns:1fr 1fr 1.25fr;
    gap:8px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .status-item{text-align:center}
  .status-label{font-size:12px;color:var(--muted)}
  .status-value{font-size:clamp(18px,4vw,30px);font-weight:800;line-height:1.15}
  #resultValue{font-size:clamp(15px,2.4vw,24px);white-space:nowrap;line-height:1.15}
  #resultValue.fail{font-size:clamp(11px,1.65vw,17px);white-space:normal;line-height:1.25}
  .board-wrap{
    background:var(--panel);
    border:2px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--shadow);
    position:relative;
  }
  .board{
    width:100%;
    height:min(72vh,720px);
    min-height:420px;
    position:relative;
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
  }
  .board.dark{background:#111;color:#fff}
  .board.light{background:#fff;color:#111}
  .number{
    position:absolute;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-weight:800;
    line-height:1;
    transition:transform .08s ease,opacity .12s ease;
    -webkit-tap-highlight-color:transparent;
    padding:0;
    outline:none;
    box-shadow:none;
  }
  .board.light .number{background:#fff;color:#111;border:3px solid #111}
  .board.dark .number{background:#111;color:#fff;border:3px solid #fff}
  .number:active{transform:scale(.93)}
  .number.done{opacity:0;pointer-events:none;transform:scale(.5)}
  .number.wrong{animation:shake .18s linear 2}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .record-wrap{
    margin-top:12px;
    background:var(--panel);
    border:2px solid var(--border);
    border-radius:16px;
    padding:12px 14px;
    box-shadow:var(--shadow);
  }
  .record-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .record-title{font-size:18px;font-weight:800}
  .record-sub{font-size:13px;color:var(--muted)}
  .record-list{display:grid;gap:8px}
  .record-empty{font-size:14px;color:var(--muted);padding:6px 2px}
  .record-item{
    border:1.5px solid #bbb;border-radius:12px;padding:8px 10px;
    display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;align-items:center;
    font-size:14px;
  }
  .record-main{font-weight:700}
  .record-meta{color:var(--muted);font-size:12px}
  .record-time{text-align:right;font-weight:800;font-size:16px}
  .record-time.small{font-size:14px}
  dialog{
    width:min(92vw,620px);border:2px solid #111;border-radius:18px;padding:0;box-shadow:0 20px 80px rgba(0,0,0,.3)
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dialog-head{padding:16px 18px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
  .dialog-head h2{margin:0;font-size:22px}
  .close{border:none;background:transparent;font-size:28px;line-height:1}
  .settings{padding:16px 18px;display:grid;gap:16px}
  .setting{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;align-items:center}
  .setting label{font-weight:700}
  .setting select,.setting input[type="number"]{width:100%;padding:10px;border:2px solid #bbb;border-radius:10px;background:#fff}
  .seg{display:grid;border:2px solid #bbb;border-radius:10px;overflow:hidden}
  .seg.two{grid-template-columns:repeat(2,1fr)}
  .seg.three{grid-template-columns:repeat(3,1fr)}
  .seg input{display:none}
  .seg label{padding:10px 8px;text-align:center;font-weight:700;cursor:pointer;background:#fff}
  .seg input:checked + label{background:#111;color:#fff}
  .dialog-actions{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 18px}
  .note{font-size:13px;color:#666;line-height:1.6}
  @media (max-width:680px){
    .app{padding:10px}
    .header{align-items:flex-start}
    .top-actions{gap:6px}
    .btn{padding:9px 12px;border-radius:10px}
    .status{padding:8px 10px;grid-template-columns:.9fr .9fr 1.35fr}
    #resultValue{font-size:clamp(13px,3.4vw,18px)}
    #resultValue.fail{font-size:clamp(10px,2.6vw,14px)}
    .board{height:68vh;min-height:390px}
    .setting{grid-template-columns:1fr}
    .record-item{grid-template-columns:1fr;gap:4px}
    .record-time{text-align:left}
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>ナンバータッチ</h1>
      <div class="sub">1から順番にタッチしよう</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="settingsBtn">設定</button>
      <button class="btn primary" id="newGameBtn">新しく始める</button>
    </div>
  </div>

  <section class="status" id="statusBar" aria-live="polite">
    <div class="status-item"><div class="status-label">次の数字</div><div class="status-value" id="nextValue">1</div></div>
    <div class="status-item"><div class="status-label">残り</div><div class="status-value" id="remainValue">20</div></div>
    <div class="status-item"><div class="status-label">結果</div><div class="status-value" id="resultValue">—</div></div>
  </section>

  <div class="board-wrap">
    <main class="board light" id="board" aria-label="ナンバータッチの盤面"></main>
  </div>

  <section class="record-wrap" aria-live="polite">
    <div class="record-head">
      <div>
        <div class="record-title">クリア記録</div>
        <div class="record-sub">このブラウザに最新20件まで保存します</div>
      </div>
      <button class="btn" id="clearRecordsBtn">記録を消す</button>
    </div>
    <div class="record-list" id="recordList"></div>
  </section>
</div>

<dialog id="settingsDialog">
  <div class="dialog-head">
    <h2>ゲーム設定</h2>
    <button class="close" id="closeDialog" aria-label="閉じる">×</button>
  </div>
  <div class="settings">
    <div class="setting">
      <label for="count">チャレンジする数字</label>
      <select id="count">
        <option value="10">1〜10</option>
        <option value="15">1〜15</option>
        <option value="20" selected>1〜20</option>
        <option value="25">1〜25</option>
        <option value="30">1〜30</option>
      </select>
    </div>

    <div class="setting">
      <label>配色</label>
      <div class="seg two">
        <input id="themeLight" name="theme" type="radio" value="light" checked><label for="themeLight">白地・黒文字</label>
        <input id="themeDark" name="theme" type="radio" value="dark"><label for="themeDark">黒地・白文字</label>
      </div>
    </div>

    <div class="setting">
      <label>丸の大きさ</label>
      <div class="seg two">
        <input id="sizeSame" name="sizeMode" type="radio" value="same" checked><label for="sizeSame">同じ大きさ</label>
        <input id="sizeRandom" name="sizeMode" type="radio" value="random"><label for="sizeRandom">大きさバラバラ</label>
      </div>
    </div>

    <div class="setting">
      <label>並べ方</label>
      <div class="seg three">
        <input id="layoutRandom" name="layoutMode" type="radio" value="random" checked><label for="layoutRandom">バラバラ</label>
        <input id="layoutGrid" name="layoutMode" type="radio" value="grid"><label for="layoutGrid">列で並べる</label>
        <input id="layoutWorksheet" name="layoutMode" type="radio" value="worksheet"><label for="layoutWorksheet">ワークシート</label>
      </div>
    </div>

    <div class="setting">
      <label>タイム測定</label>
      <div class="seg two">
        <input id="timerOn" name="timerMode" type="radio" value="on" checked><label for="timerOn">する</label>
        <input id="timerOff" name="timerMode" type="radio" value="off"><label for="timerOff">しない</label>
      </div>
    </div>

    <div class="note">タイム測定を「する」にした場合も、プレイ中はタイムの枠を表示しません。①を押した瞬間に内部で計測を始め、最後の数字を押したときに結果を表示します。</div>
  </div>
  <div class="dialog-actions">
    <button class="btn" id="cancelSettings">キャンセル</button>
    <button class="btn primary" id="applySettings">この設定で始める</button>
  </div>
</dialog>

<script>
(() => {
  const board = document.getElementById('board');
  const nextValue = document.getElementById('nextValue');
  const resultValue = document.getElementById('resultValue');
  const remainValue = document.getElementById('remainValue');
  const dialog = document.getElementById('settingsDialog');
  const recordList = document.getElementById('recordList');

  const STORAGE_SETTINGS = 'numbertouch_settings_v2';
  const STORAGE_RECORDS = 'numbertouch_records_v1';

  let settings = loadSettings();
  let next = 1;
  let running = false;
  let finished = false;
  let startAt = 0;
  let raf = null;
  let elapsed = 0;
  let wrongCount = 0;
  let audioCtx = null;

  const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

  function safeParse(key, fallback){
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  function loadSettings(){
    const saved = safeParse(STORAGE_SETTINGS, null);
    return {
      count: [10,15,20,25,30].includes(saved?.count) ? saved.count : 20,
      theme: ['light','dark'].includes(saved?.theme) ? saved.theme : 'light',
      sizeMode: ['same','random'].includes(saved?.sizeMode) ? saved.sizeMode : 'same',
      layoutMode: ['random','grid','worksheet'].includes(saved?.layoutMode) ? saved.layoutMode : 'random',
      timer: typeof saved?.timer === 'boolean' ? saved.timer : true
    };
  }

  function saveSettings(){
    localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(settings));
  }

  function readSettings(){
    return {
      count: Number(document.getElementById('count').value),
      theme: document.querySelector('input[name="theme"]:checked').value,
      sizeMode: document.querySelector('input[name="sizeMode"]:checked').value,
      layoutMode: document.querySelector('input[name="layoutMode"]:checked').value,
      timer: document.querySelector('input[name="timerMode"]:checked').value === 'on'
    };
  }

  function fillSettingsForm(){
    document.getElementById('count').value = settings.count;
    document.querySelector(`input[name="theme"][value="${settings.theme}"]`).checked = true;
    document.querySelector(`input[name="sizeMode"][value="${settings.sizeMode}"]`).checked = true;
    document.querySelector(`input[name="layoutMode"][value="${settings.layoutMode}"]`).checked = true;
    document.querySelector(`input[name="timerMode"][value="${settings.timer ? 'on' : 'off'}"]`).checked = true;
  }

  function stopTimer(){
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function tick(now){
    if (!running) return;
    elapsed = (now - startAt) / 1000;
    raf = requestAnimationFrame(tick);
  }

  function startTimer(){
    if (!settings.timer || running) return;
    running = true;
    startAt = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function formatLayout(mode){
    return mode === 'random' ? 'バラバラ' : mode === 'grid' ? '列で並べる' : 'ワークシート';
  }

  function formatSize(mode){
    return mode === 'same' ? '同じ大きさ' : '大きさバラバラ';
  }

  function getRecords(){
    return safeParse(STORAGE_RECORDS, []);
  }

  function saveRecord(entry){
    const records = getRecords();
    records.unshift(entry);
    localStorage.setItem(STORAGE_RECORDS, JSON.stringify(records.slice(0,20)));
    renderRecords();
  }

  function renderRecords(){
    const records = getRecords();
    if(!records.length){
      recordList.innerHTML = '<div class="record-empty">まだ記録がありません。</div>';
      return;
    }
    recordList.innerHTML = records.map((r) => {
      const timeText = r.timer ? `${Number(r.time).toFixed(2)}秒` : 'タイムなし';
      const date = new Date(r.clearedAt);
      const dateText = `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
      return `
        <div class="record-item">
          <div>
            <div class="record-main">1〜${r.count} / ${formatLayout(r.layoutMode)}</div>
            <div class="record-meta">${formatSize(r.sizeMode)} / ${r.theme === 'light' ? '白地・黒文字' : '黒地・白文字'}</div>
          </div>
          <div class="record-meta">${dateText}</div>
          <div class="record-time ${r.timer ? '' : 'small'}">${timeText}</div>
        </div>
      `;
    }).join('');
  }



  function getAudioContext(){
    if(!audioCtx){
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if(AudioContextClass) audioCtx = new AudioContextClass();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, type='sine', volume=.16, delay=0){
    const ctx = getAudioContext();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const start = ctx.currentTime + delay;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + .012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + .02);
  }

  function playCorrectSound(){
    // 「ピンポン」：高めの2音
    playTone(880, .11, 'sine', .14, 0);
    playTone(1175, .15, 'sine', .13, .105);
  }

  function playWrongSound(){
    // 「ブブー」：低めの2音
    playTone(150, .13, 'square', .10, 0);
    playTone(115, .22, 'square', .09, .11);
  }

  function failGame(){
    finished = true;
    stopTimer();
    resultValue.classList.add('fail');
    resultValue.textContent = 'もういちど　最初からチャレンジしてね';
  }

  function finishGame(){
    finished = true;
    resultValue.classList.remove('fail');
    if (settings.timer) {
      elapsed = (performance.now() - startAt) / 1000;
      stopTimer();
      resultValue.textContent = `クリア！ ${elapsed.toFixed(2)}秒`;
    } else {
      resultValue.textContent = 'クリア！';
    }
    saveRecord({
      count: settings.count,
      theme: settings.theme,
      sizeMode: settings.sizeMode,
      layoutMode: settings.layoutMode,
      timer: settings.timer,
      time: elapsed,
      clearedAt: new Date().toISOString()
    });
    nextValue.textContent = '✓';
    remainValue.textContent = '0';
  }

  function updateStatus(){
    nextValue.textContent = next <= settings.count ? next : '✓';
    remainValue.textContent = Math.max(0, settings.count - next + 1);
  }

  function makeNumber(value,x,y,size){
    const el = document.createElement('div');
    el.className = 'number';
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '-1');
    el.textContent = value;
    el.dataset.value = value;
    el.setAttribute('aria-label', `${value}`);
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.width = `${size}px`;
    el.style.height = `${size}px`;
    el.style.fontSize = `${Math.round(size * (value >= 10 ? .42 : .5))}px`;
    el.addEventListener('click', () => handleTap(el, value));
    return el;
  }

  function handleTap(el,value){
    if (finished) return;
    if (value !== next) {
      wrongCount++;
      playWrongSound();
      el.classList.remove('wrong');
      void el.offsetWidth;
      el.classList.add('wrong');
      if(wrongCount >= 5) failGame();
      return;
    }
    playCorrectSound();
    if (value === 1) startTimer();
    el.blur();
    el.style.display = 'none';
    el.remove();
    next++;
    updateStatus();
    if (value === settings.count) finishGame();
  }

  function worksheetLayout(count,w,h){
    const cols = count <= 12 ? 6 : count <= 20 ? 7 : 6;
    const rows = Math.ceil(count / cols);
    const sidePad = Math.max(14, w * 0.02);
    const topPad = Math.max(18, h * 0.05);
    const gapX = clamp((w - sidePad * 2) / (cols * 5.2), 10, 22);
    const gapY = clamp((h - topPad * 2) / (rows * 8), 10, 26);
    const cellW = (w - sidePad * 2 - gapX * (cols - 1)) / cols;
    const cellH = (h - topPad * 2 - gapY * (rows - 1)) / rows;
    const size = clamp(Math.min(cellW, cellH) * 0.98, 48, 112);
    const positions = [];
    for(let i=0;i<count;i++){
      const c = i % cols;
      const r = Math.floor(i / cols);
      const x = sidePad + c * (cellW + gapX) + (cellW - size) / 2;
      const y = topPad + r * (cellH + gapY) + (cellH - size) / 2;
      positions.push({x,y,size});
    }
    for(let i=positions.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [positions[i],positions[j]] = [positions[j],positions[i]];
    }
    return positions;
  }

  function gridLayout(count,w,h){
    const aspect = w / h;
    let cols = Math.ceil(Math.sqrt(count * aspect));
    cols = clamp(cols, 3, 7);
    let rows = Math.ceil(count / cols);
    while(rows > 7){ cols++; rows = Math.ceil(count / cols); }
    const gap = Math.max(10, Math.min(w,h) * 0.025);
    const cellW = (w - gap * (cols + 1)) / cols;
    const cellH = (h - gap * (rows + 1)) / rows;
    const size = clamp(Math.min(cellW,cellH) * 0.90, 48, 116);
    const positions = [];
    for(let i=0;i<count;i++){
      const c = i % cols, r = Math.floor(i / cols);
      const x = gap + c * (cellW + gap) + (cellW - size) / 2;
      const y = gap + r * (cellH + gap) + (cellH - size) / 2;
      positions.push({x,y,size});
    }
    return positions;
  }

  function randomLayout(count,w,h){
    const minSide = Math.min(w,h);
    const factor =
      count <= 10 ? 0.19 :
      count <= 15 ? 0.165 :
      count <= 20 ? 0.145 :
      count <= 25 ? 0.13 : 0.118;
    const base = clamp(minSide * factor, 50, 112);
    const pad = 10;

    // 盤面全体を小さな区画に分け、各区画へ1個ずつ置くことで
    // 上下左右へ偏らず、全体に散らばる配置にする。
    const aspect = w / h;
    let cols = Math.ceil(Math.sqrt(count * aspect));
    cols = clamp(cols, 3, 8);
    const rows = Math.ceil(count / cols);
    const cellW = (w - pad * 2) / cols;
    const cellH = (h - pad * 2) / rows;

    const cells = [];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++) cells.push({c,r});
    }
    for(let i=cells.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [cells[i],cells[j]] = [cells[j],cells[i]];
    }

    const items = [];
    for(let i=0;i<count;i++){
      const {c,r} = cells[i];
      let size = settings.sizeMode === 'same' ? base : base * (0.62 + Math.random() * 0.86);
      size = clamp(size, 40, 138);
      size = Math.min(size, cellW * .88, cellH * .88);

      const freeX = Math.max(0, cellW - size);
      const freeY = Math.max(0, cellH - size);
      const x = pad + c * cellW + freeX * (0.10 + Math.random() * 0.80);
      const y = pad + r * cellH + freeY * (0.10 + Math.random() * 0.80);
      items.push({x,y,size});
    }

    // 数字順と位置の対応もさらにシャッフルする
    for(let i=items.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [items[i],items[j]]=[items[j],items[i]];
    }
    return items;
  }

  function newGame(){
    stopTimer();
    next = 1;
    elapsed = 0;
    wrongCount = 0;
    finished = false;
    board.innerHTML = '';
    board.classList.toggle('light', settings.theme === 'light');
    board.classList.toggle('dark', settings.theme === 'dark');
    updateStatus();
    resultValue.classList.remove('fail');
    resultValue.textContent = '—';
    saveSettings();

    requestAnimationFrame(() => {
      const w = board.clientWidth, h = board.clientHeight;
      let pos;
      if(settings.layoutMode === 'worksheet'){
        pos = worksheetLayout(settings.count,w,h);
      } else if(settings.layoutMode === 'grid'){
        pos = gridLayout(settings.count,w,h);
        for(let i=pos.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [pos[i],pos[j]]=[pos[j],pos[i]];
        }
      } else {
        pos = randomLayout(settings.count,w,h);
      }

      for(let i=1;i<=settings.count;i++){
        const p = pos[i-1];
        let s = p.size;
        if(settings.sizeMode === 'random' && settings.layoutMode !== 'random'){
          s = clamp(p.size * (0.62 + Math.random() * 0.72), 40, p.size * 1.16);
        }
        board.appendChild(makeNumber(i, p.x + (p.size - s) / 2, p.y + (p.size - s) / 2, s));
      }
    });
  }

  document.getElementById('settingsBtn').addEventListener('click', () => { fillSettingsForm(); dialog.showModal(); });
  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('closeDialog').addEventListener('click', () => dialog.close());
  document.getElementById('cancelSettings').addEventListener('click', () => dialog.close());
  document.getElementById('applySettings').addEventListener('click', () => {
    settings = readSettings();
    dialog.close();
    newGame();
  });
  document.getElementById('clearRecordsBtn').addEventListener('click', () => {
    // confirm() は埋め込み表示や一部ブラウザで動作を止められることがあるため使わない。
    // このアプリで使った記録キーを確実に削除する。
    localStorage.removeItem(STORAGE_RECORDS);
    localStorage.removeItem('numbertouch_records');
    localStorage.removeItem('numbertouch_records_v1');

    renderRecords();

    const btn = document.getElementById('clearRecordsBtn');
    const original = btn.textContent;
    btn.textContent = '消しました';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = original;
      btn.disabled = false;
    }, 1000);
  });
  window.addEventListener('resize', () => { if(!finished) newGame(); });

  renderRecords();
  fillSettingsForm();
  newGame();
})();
</script>
</body>
</html>
